<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="COMRADE'S Grocery Mart — Order fresh fruits, vegetables, dairy, staples & snacks online with superfast 15-30 minute doorstep delivery." />
    <meta name="theme-color" content="#064e3b" />
    <title>COMRADE'S Grocery Mart | Superfast 15-Min Delivery</title>
    <script type="text/javascript">
      // SPA Fallback redirect for GitHub Pages
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }());
    </script>
  </head>
  <body class="bg-[#fcfbf7] text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
