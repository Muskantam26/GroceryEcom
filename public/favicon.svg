<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Container -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)" />
  
  <!-- Shopping Basket Base -->
  <path d="M128 210 H384 L352 410 H160 Z" fill="#ffffff" />
  <path d="M160 210 L352 210" stroke="#e2e8f0" stroke-width="12" />

  <!-- Basket Handle -->
  <path d="M176 210 C176 110 336 110 336 210" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" />
  
  <!-- Fresh Organic Leaf Badge -->
  <path d="M256 250 C310 230 350 280 330 340 C300 390 240 370 230 320 C220 270 256 250 256 250 Z" fill="url(#leafGrad)" />
  <path d="M256 250 C270 290 290 330 325 345" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- 15 Min Delivery Lightning Badge -->
  <circle cx="370" cy="140" r="50" fill="url(#accentGrad)" />
  <path d="M375 110 L345 145 H375 L365 175 L395 140 H365 Z" fill="#ffffff" />
</svg>